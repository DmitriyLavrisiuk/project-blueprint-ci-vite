# Обновления раз в неделю: минорные и патчи — одним PR, мажоры каркаса поднимаются вручную,
# версии GitHub Actions — тоже здесь, иначе они застывают.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Мажор типов Node идёт за версией Node проекта, а не за последней.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
